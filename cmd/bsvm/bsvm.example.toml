datadir = "./data"
genesis = ""
log_level = "info"
log_format = "text"

[shard]
chain_id = 8453111
genesis_covenant_txid = ""
genesis_covenant_vout = 0
covenant_sats = 10000

[overlay]
coinbase = "0x0000000000000000000000000000000000000000"
block_gas_limit = 30000000
batch_size = 128
max_batch_flush_delay = "2s"
min_gas_price = "1000000000"
max_speculative_depth = 16

[rpc]
http_addr = "0.0.0.0:8545"
ws_addr = "0.0.0.0:8546"
cors_origins = ["*"]

[prover]
# Backend that runs the SP1 host. "mock" (default) returns synthetic
# proofs without invoking any Rust subprocess — fine for unit tests
# and Solidity-side dev. "local" launches the bsvm-host-bridge binary
# as a subprocess (requires host_bridge_binary + guest_elf_path
# below). "network" submits to the SP1 prover network (requires an
# SP1 prover-network subscription; today the host returns an error
# until the SDK subscription path lands).
mode = "mock"
# Maximum concurrent proving operations. Currently parsed but NOT
# yet propagated to a ParallelProver in the daemon boot path — set >1
# is a no-op today. Tracked as a follow-up in the spec-review triage
# document (Claim 1, sub-bullet ParallelProver wiring).
workers = 1
# Absolute path to the bsvm-host-bridge Rust binary. Empty when
# mode = "mock"; required when mode = "local" or "network". The
# binary is built by the prover Cargo workspace; the build script
# emits it under target/release/bsvm-host-bridge.
# host_bridge_binary = "/abs/path/to/bsvm-host-bridge"
# Absolute path to the compiled SP1 guest ELF. Empty when
# mode = "mock"; required when mode = "local" or "network". Built
# by `cd prover/guest && cargo prove build --release`; emitted under
# elf/riscv32im-succinct-zkvm-elf.
# guest_elf_path = "/abs/path/to/guest.elf"
# SP1 prover-network endpoint (only consulted when mode = "network").
# Empty defers to the SP1 SDK default. Override to point at a
# self-hosted prover pool or a regional Succinct endpoint.
# network_url = "https://rpc.succinct.xyz"
# Per-Prove() wall-clock cap. Parsed via time.ParseDuration. Empty
# inherits the prover package default (10 minutes). Set to "0s" to
# disable the timeout entirely (offline batch proving).
# timeout = "10m"
# On-chain verification path the produced proof targets:
# "fri" (Mode 1, on-chain SP1 STARK verifier — default for backwards
# compatibility with the prover package), "groth16" (Mode 2, generic
# BN254 multi-pairing) or "groth16-wa" (Mode 3, witness-assisted
# Groth16, smallest on-chain footprint). Mock mode + Groth16 is
# rejected at startup as contradictory — mock proofs cannot satisfy
# a Groth16 on-chain verifier.
# proof_mode = "fri"
# SP1 proof envelope format the host bridge emits. "compressed"
# (default) is the standard SP1 compressed proof; "core" is the raw
# core proof; "groth16" is the BN254-wrapped Groth16 envelope used
# by Mode 2/Mode 3 covenants; "execute" runs the SP1 guest in
# execute mode without producing a STARK (used by spec 16's `execute`
# devnet preset).
# sp1_proof_mode = "compressed"

[network]
listen_addr = "/ip4/0.0.0.0/tcp/9945"
bootstrap_peers = []
max_peers = 50

[bsv]
# Legacy single-endpoint BSV-node JSON-RPC URL. Retained for backward
# compat. Prefer node_urls below for testnet/mainnet failover (W6-11).
node_url = ""
# W6-11 BSV-node failover. List one or more endpoints in preference
# order; index 0 is the primary, index 1+ are backups consulted on
# transport / 5xx errors. Empty list falls back to node_url. When
# both are set, node_urls wins. Application-level RPC errors are NOT
# retried (a deterministic answer would not change between nodes).
node_urls = []
# Park a node after this many consecutive transport / 5xx failures.
node_max_consecutive_failures = 3
# Cooldown duration before a parked node is retried.
node_cooldown = "30s"
# Legacy single-endpoint ARC URL. Prefer [[bsv.arc_endpoint]] for
# multi-endpoint fan-out (W6-3). When both are set, arc_endpoint wins.
arc_url = ""
# Fan-out strategy: "first_success" (default) or "quorum".
arc_strategy = "first_success"
# Required when arc_strategy = "quorum".
arc_quorum = 0
arc_default_timeout = "30s"
arc_callback_url = ""
arc_callback_token = ""
network = "mainnet"
fee_wallet_key = ""
confirmations = 6
# In-process LRU bound for cached WhatsOnChain GetTx lookups (W6-8).
# WoC enforces per-IP rate limits; caching content-addressed lookups
# keeps the budget free for fresh queries. Set to 0 to disable.
woc_cache_size = 1000
# Per-block tx-fetch cap for the chaintracks-only block-scan path.
# Defensive ceiling on the WoC fan-out a single block can trigger;
# anything beyond is logged + skipped so a pathological block can't
# exhaust an operator's daily WoC quota. Default 1_000_000 (well above
# any block ever mined). Lower this on rate-limit-budget-constrained
# free-tier deployments; raise it on paid-tier high-throughput shards.
woc_block_tx_fanout_max = 1000000
# Per-block page-fetch concurrency for the paginated GetBlockTxIDs
# path. WoC paginates large blocks (~10k+ txs) into per-page endpoints;
# this controls how many pages are fetched in parallel. Default 4 —
# balances aggregate throughput against burst-load on the WoC API.
# Operators on the free tier should keep it low; paid-tier operators
# may raise it for faster cold-start scans.
woc_block_page_fetch_workers = 4

# Multi-endpoint ARC fan-out (W6-3). Add one block per ARC provider.
# [[bsv.arc_endpoint]]
# name = "taal"
# url = "https://arc.taal.com"
# auth_token = ""
# timeout = "30s"
# max_retries = 1
# retry_backoff = "100ms"

# BRC-104 mutual-auth for inbound ARC callbacks (W6-10).
# When enabled with at least one identity, callbacks must carry
# valid BRC-104 headers. Set allow_token = true during migration to
# also accept the legacy X-CallbackToken header.
[bsv.arc_brc104]
enabled = false
timestamp_window = "60s"
nonce_cache_size = 8192
allow_token = true
# [[bsv.arc_brc104.identity]]
# name = "arc-prod"
# public_key_hex = "02..."  # 33-byte compressed or 65-byte uncompressed

# Chaintracks header oracle. Default ships ONE provider so quorum stays
# opt-in. To enable W6-2 multi-upstream cross-checking, add additional
# [[bsv.chaintracks.providers]] blocks and bump quorum_m to >=2.
# See docs/decisions/header-oracle-quorum.md for the full design.
[bsv.chaintracks]
quorum_strategy = "hybrid"          # "hybrid" or "m_of_n"
quorum_m = 1                         # mainnet shards should set >=2
disagreement_action = "log"          # "log", "drop", or "halt"
disagreement_cooldown = "10m"
response_timeout = "5s"
stream_skew_window = "750ms"
stream_buffer_max = 32

[[bsv.chaintracks.providers]]
name = "bhs-primary"
url  = "https://headers.example.com/api/v1/chain"
api_key = ""
weight = 1
timeout = "5s"
enabled = true

# Example secondary provider (commented out by default — opt in to
# enable quorum and bump quorum_m above to 2):
# [[bsv.chaintracks.providers]]
# name = "bhs-secondary"
# url  = "https://headers.other.example/headers"
# api_key = ""
# weight = 1
# timeout = "5s"
# enabled = true

[bridge]
min_deposit_satoshis = 10000
min_withdrawal_satoshis = 10000
bsv_confirmations = 6

[database]
engine = "leveldb"
cache_mb = 256

[governance]
mode = "none"
keys = []
threshold = 0

[beef]
# Spec-17 BEEF gossip + ARC callback endpoints under /bsvm/* on the
# JSON-RPC HTTP listener. Keep enabled on any node that participates
# in the BEEF gossip topic (effectively every shard node).
enabled = true
# Bridge-deposit security default. Leave false until W6-4 ships full
# BRC-62 ancestry + script re-exec verification — the route always
# stores the envelope, but only credits the deposit on L2 when the
# verification gate passes. Devnet operators can flip this to true to
# pre-flight the wiring without ancestry verification.
accept_unverified_bridge_deposits = false

[evm]
# EVM hardfork rule set. Both the Go EVM (pkg/vm) and the SP1 guest's
# revm pin Cancun in v1; this knob makes the active fork explicit in
# operator config. Future fork bumps (e.g. Prague) require updating
# both EVMs AND the supportedEVMForks list in cmd/bsvm/config.go before
# this value is changed. An unsupported fork name is a startup error.
fork = "cancun"

[metrics]
# Standalone Prometheus /metrics HTTP listener. Kept separate from the
# JSON-RPC HTTP server so operators can firewall it independently:
# the JSON-RPC port faces user wallets while /metrics faces the
# internal monitoring network.
#
# Set enabled = false to skip the listener entirely; subsystems still
# wire their counters against a fresh no-op registry so .Inc() /
# .Observe() calls remain safe but the values never reach a scrape.
enabled = true
# Default loopback-only so a fresh install doesn't leak metrics to the
# public internet. Switch to "0.0.0.0:9100" once the host firewall is
# in place to let an external Prometheus instance scrape directly.
listen_addr = "127.0.0.1:9100"
# Metric-name prefix the Counters layer (pkg/metrics/counters.go) uses
# for every collector it owns. Default "bsvm" yields names like
# bsvm_bridge_deposits_total, bsvm_arc_broadcast_attempts_total, etc.
# Override per deployment ("myshard") to brand every Counters-owned
# metric without touching the call sites that .Inc() them. The spec-17
# NetworkMetrics layer keeps its bsvevm_ prefix because those names
# are part of the public spec-17 surface.
namespace = "bsvm"

# -----------------------------------------------------------------------------
# Worked example: BSV-node failover (W6-11)
# -----------------------------------------------------------------------------
# A testnet operator with two self-hosted BSV nodes plus a public fallback
# would set the [bsv] block roughly as follows:
#
# [bsv]
# # Leave node_url empty (or set it to the primary, it is ignored when
# # node_urls is non-empty).
# node_url = ""
# node_urls = [
#   "http://rpc-user:rpc-pass@bsv-primary.internal:8332/",
#   "http://rpc-user:rpc-pass@bsv-secondary.internal:8332/",
#   "http://rpc-user:rpc-pass@bsv-public.example.com:8332/",
# ]
# node_max_consecutive_failures = 3
# node_cooldown = "60s"
# network = "testnet"
#
# Index 0 is hit on every call; index 1 only on connection error or 5xx
# from index 0; index 2 only when both prior fail. After 3 consecutive
# failures a node is parked for 60s, after which it is retried.
# Application-level RPC errors (tx not found, mempool conflict, etc.)
# are surfaced immediately and never trigger failover — the next node
# would return the same answer.

# -----------------------------------------------------------------------------
# Worked example: chaintracks header oracle quorum (W6-2)
# -----------------------------------------------------------------------------
# The default [bsv.chaintracks] block above ships ONE provider with
# quorum_m = 1 so brand-new operators can boot without standing up multiple
# Block Headers Service (BHS) endpoints. Mainnet shards SHOULD enable quorum
# by configuring 2-3 independent providers and bumping quorum_m to >=2 — this
# is what catches a single upstream silently serving stale or forged headers.
#
# A mainnet operator running with three BHS endpoints (one self-hosted, two
# third-party) would replace the default [bsv.chaintracks] block with the
# section below. Append-only example — the live config is the [bsv.chaintracks]
# block higher up in this file; this section is documentation, kept in its
# own marked region so sibling-agent merges stay trivial.
#
# [bsv.chaintracks]
# # "hybrid" combines weighted voting (uses provider weights) with an
# # explicit floor of `quorum_m` agreeing endpoints. "m_of_n" is strict
# # M-of-N agreement with no weighting. Default: "hybrid".
# quorum_strategy = "hybrid"
# # Minimum number of providers that must agree before the chaintracks
# # client accepts a header. 1 disables cross-checking; 2 requires any
# # two providers to agree; 3 (with three configured providers) requires
# # unanimity. Mainnet shards should set this to >= 2.
# quorum_m = 2
# # What to do when providers disagree:
# #   "log"  — emit a structured WARN log and continue using the majority
# #            answer (default; safest while operating)
# #   "drop" — also suspend the deviant provider for `disagreement_cooldown`
# #   "halt" — halt the node entirely (use only after extensive tuning)
# disagreement_action = "drop"
# # How long a provider stays suspended after disagreement_action="drop".
# disagreement_cooldown = "10m"
# # Per-fan-out call timeout. Slow providers exceeding this are treated
# # as a non-vote for that round, not a hard failure.
# response_timeout = "5s"
# # How long to buffer streamed events per child before resolving quorum.
# # Larger windows tolerate more clock skew between providers; smaller
# # windows lower stream latency.
# stream_skew_window = "750ms"
# # Per-child reorg buffer cap. Prevents a misbehaving provider from
# # consuming unbounded memory by streaming an arbitrarily long reorg.
# stream_buffer_max = 32
#
# # Provider 1 — self-hosted BHS (highest weight: we trust ourselves most).
# [[bsv.chaintracks.providers]]
# name    = "bhs-self-hosted"                    # operator-chosen label, used in logs
# url     = "https://chaintracks.example/api/v1" # BHS HTTP base URL
# api_key = ""                                   # optional; set if upstream requires bearer auth
# weight  = 3                                    # vote weight under "hybrid"; ignored under "m_of_n"
# timeout = "5s"                                 # per-request timeout (overrides response_timeout for this provider)
# enabled = true                                 # set false to keep the config but skip in fan-out
#
# # Provider 2 — third-party BHS (medium weight).
# [[bsv.chaintracks.providers]]
# name    = "bhs-vendor-a"
# url     = "https://headers.vendor-a.example/api/v1"
# api_key = "REPLACE_WITH_VENDOR_A_KEY"
# weight  = 2
# timeout = "5s"
# enabled = true
#
# # Provider 3 — independent third-party BHS (lower weight, used as tiebreaker).
# [[bsv.chaintracks.providers]]
# name    = "bhs-vendor-b"
# url     = "https://chaintracks.vendor-b.example/api/v1"
# api_key = "REPLACE_WITH_VENDOR_B_KEY"
# weight  = 1
# timeout = "5s"
# enabled = true
#
# Behaviour with this config under "hybrid" + quorum_m = 2:
#   - Total weight = 3 + 2 + 1 = 6; majority weight threshold = 4.
#   - Any header agreed by `bhs-self-hosted` + either vendor (3+2=5 or
#     3+1=4) clears the weighted majority AND meets the floor of 2
#     agreeing providers.
#   - If `bhs-self-hosted` is offline, the two vendors must agree
#     (weight 2+1=3 < 4 — falls back to floor: 2 agreeing providers).
#   - If only one provider responds within `response_timeout`, the
#     round fails the quorum and the chaintracks client retries with
#     backoff. See docs/decisions/header-oracle-quorum.md.
