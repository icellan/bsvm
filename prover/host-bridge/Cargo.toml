[package]
name = "bsvm-host-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
sp1-sdk = { version = "6.0.2", default-features = false }
sp1-build = "6.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
sp1-build = "6.0.2"
# Phase 2 in-tree-ELF fast-path probes the sha256 of
# prover/guest/elf/bsvm-guest before invoking docker. See
# docs/decisions/sp1-reproducible-build-2026-05.md.
sha2 = "0.10"
hex = "0.4"
